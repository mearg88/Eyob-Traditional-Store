<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EE" />
    <title>Eyob Traditional Store — Ethiopian Handwoven Clothing</title>
    <meta
      name="description"
      content="Handwoven Ethiopian traditional clothing — habesha kemis, netela, gabi and kuta — made in Addis Ababa and shipped worldwide."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Social preview tags are rewritten per-product by api/og.ts for crawler
         user-agents; these are the defaults humans and unmatched bots get. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eyob Traditional Store" />
    <meta property="og:description" content="Handwoven Ethiopian traditional clothing, shipped worldwide." />
  </head>
  <body class="bg-cotton-100">
    <div id="root"></div>
    <script>
      // Clean URLs exist so that link previews work: WhatsApp and Facebook
      // crawlers are served real Open Graph tags at /product/<slug>, because a
      // fragment (#/product/<slug>) never reaches the server at all.
      //
      // A human landing on the same clean URL gets index.html and is moved to
      // the hash route the router actually uses. This runs before the bundle
      // loads, so there is no flash of the wrong screen.
      (function () {
        var path = window.location.pathname;
        if (path !== '/' && !window.location.hash) {
          window.location.replace('/#' + path + window.location.search);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
